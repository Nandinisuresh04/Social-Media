services:
  postgres:
    image: postgres:15
    container_name: socialmedia_postgres
    environment:
      POSTGRES_DB: socialmediadb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGTZ: UTC
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: socialmedia_redis
    ports:
      - "6379:6379"